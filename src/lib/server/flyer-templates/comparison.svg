<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1500" viewBox="0 0 1050 1500">
 <defs>
  <style>.display{font-family:'Arial Black',Arial,Helvetica,sans-serif;font-weight:900}.sans{font-family:Arial,Helvetica,sans-serif}.white{fill:#fff}.navy{fill:{{NAVY}}}.gold{fill:{{GOLD}}}</style>
  <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><circle cx="1" cy="1" r=".6" fill="#e7eaed"/></pattern>
 </defs>
 <rect width="1050" height="1500" fill="url(#paper)"/>
 <image href="{{LOGO}}" x="66" y="34" width="122" height="116" preserveAspectRatio="xMidYMid meet"/>
 <rect x="205" y="35" width="4" height="116" fill="{{GOLD}}"/>
 {{COMPARE_HEADER}}
 <rect x="824" y="42" width="188" height="88" rx="8" fill="#f0f3f6"/>
 <text class="sans navy" x="917" y="60" font-size="10" text-anchor="middle" letter-spacing="1.4">POWERED BY</text>
 <image href="{{BRAND}}" x="838" y="71" width="160" height="48" preserveAspectRatio="xMidYMid meet"/>
 {{COMPARE_TITLE}}
 <line x1="42" y1="378" x2="171" y2="378" stroke="{{GOLD}}" stroke-width="3"/>
 <line x1="879" y1="378" x2="1008" y2="378" stroke="{{GOLD}}" stroke-width="3"/>
 {{COMPARE_SUBTITLE}}

 <rect x="40" y="425" width="463" height="609" rx="12" fill="#fff" stroke="#d3d9df" stroke-width="2"/>
 <rect x="40" y="425" width="463" height="76" rx="12" fill="{{NAVY}}"/>
 <rect x="40" y="484" width="463" height="18" fill="{{NAVY}}"/>
 <rect x="547" y="425" width="463" height="609" rx="12" fill="#fff" stroke="#d3d9df" stroke-width="2"/>
 <rect x="547" y="425" width="463" height="76" rx="12" fill="{{NAVY}}"/>
 <rect x="547" y="484" width="463" height="18" fill="{{NAVY}}"/>
 {{COMPARE_CARDS}}
 <circle cx="525" cy="725" r="35" fill="{{NAVY}}" stroke="#fff" stroke-width="6"/>
 <text class="display white" x="525" y="735" font-size="25" text-anchor="middle">VS.</text>
 <rect x="41" y="1054" width="968" height="160" rx="7" fill="#f1f4f7"/>
 <rect x="287" y="1071" width="4" height="124" fill="{{GOLD}}"/>
 <circle cx="161" cy="1132" r="52" fill="#fff" stroke="{{NAVY}}" stroke-width="5"/>
 <image href="{{LOGO}}" x="118" y="1089" width="86" height="86" preserveAspectRatio="xMidYMid meet"/>
 {{COMPARE_NOTE}}

 <rect y="1234" width="1050" height="218" fill="{{NAVY}}"/>
 <rect y="1234" width="1050" height="5" fill="{{GOLD}}"/>
 <rect x="34" y="1256" width="174" height="174" rx="8" fill="#fff"/>
 <image href="{{QR}}" x="39" y="1261" width="164" height="164"/>
 <rect x="232" y="1262" width="4" height="158" fill="{{GOLD}}"/>
 {{COMPARE_CTA}}
 <text class="sans white" x="262" y="1398" font-size="19" font-weight="700">SCAN THE CODE FOR CAMPAIGN DETAILS</text>
 <rect y="1452" width="1050" height="48" fill="#e3e8ed"/>
 <text class="sans navy" x="525" y="1483" font-size="15" text-anchor="middle" font-weight="700" letter-spacing="1">SAME COMMUNITY. MORE WAYS TO HELP.</text>
</svg>
