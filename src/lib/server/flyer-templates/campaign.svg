<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1500" viewBox="0 0 1050 1500">
  <defs>
    <linearGradient id="heroShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{NAVY}}" stop-opacity="1"/>
      <stop offset=".36" stop-color="{{NAVY}}" stop-opacity=".96"/>
      <stop offset=".67" stop-color="{{NAVY}}" stop-opacity=".54"/>
      <stop offset="1" stop-color="{{NAVY}}" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{NAVY}}" stop-opacity="0"/>
      <stop offset="1" stop-color="{{NAVY}}" stop-opacity=".8"/>
    </linearGradient>
    <clipPath id="heroClip"><rect width="1050" height="690"/></clipPath>
    <clipPath id="causeMarkClip"><circle cx="525" cy="1078" r="43"/></clipPath>
    <style>
      .display{font-family:'Arial Black',Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-.4px}
      .sans{font-family:Arial,Helvetica,sans-serif}
      .white{fill:#fff}.navy{fill:{{NAVY}}}.gold{fill:{{GOLD}}}
    </style>
  </defs>

  <rect width="1050" height="690" fill="{{NAVY}}"/>
  <g clip-path="url(#heroClip)">
    <image href="{{PHOTO}}" x="300" y="0" width="750" height="690" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1050" height="690" fill="url(#heroShade)"/>
    <rect y="500" width="1050" height="190" fill="url(#heroFade)"/>
  </g>
  <rect x="42" y="35" width="137" height="118" rx="8" fill="{{NAVY}}" opacity=".65"/>
  <image href="{{LOGO}}" x="50" y="42" width="121" height="104" preserveAspectRatio="xMidYMid meet"/>
  <rect x="190" y="43" width="4" height="108" fill="{{GOLD}}"/>
  {{HEADER}}
  <rect x="823" y="33" width="188" height="88" rx="8" fill="#fff" opacity=".96"/>
  <text class="sans navy" x="917" y="52" font-size="10" text-anchor="middle" letter-spacing="1.5">POWERED BY</text>
  <image href="{{BRAND}}" x="836" y="63" width="162" height="48" preserveAspectRatio="xMidYMid meet"/>
  {{HERO_HEADLINE}}
  <line x1="58" y1="491" x2="251" y2="491" stroke="{{GOLD}}" stroke-width="4"/>
  <circle cx="271" cy="491" r="8" fill="{{GOLD}}"/>
  {{HERO_INTRO}}
  {{MISSION}}

  <rect y="690" width="1050" height="290" fill="#fff"/>
  {{STEPS}}

  <rect y="980" width="1050" height="290" fill="#edf1f5"/>
  <path d="M252 1063 Q330 1003 459 1043" fill="none" stroke="#838d98" stroke-width="3"/>
  <path d="M593 1043 Q720 1003 800 1063" fill="none" stroke="#838d98" stroke-width="3"/>
  <path d="M790 1237 Q525 1273 260 1237" fill="none" stroke="#838d98" stroke-width="3"/>
  <circle cx="200" cy="1078" r="54" fill="#fff" stroke="{{NAVY}}" stroke-width="5"/>
  {{SUPPORTER_ICON}}
  <circle cx="525" cy="1078" r="54" fill="#fff" stroke="{{NAVY}}" stroke-width="5"/>
  <image href="{{LOGO}}" x="482" y="1035" width="86" height="86" preserveAspectRatio="xMidYMid meet" clip-path="url(#causeMarkClip)"/>
  <circle cx="850" cy="1078" r="54" fill="#fff" stroke="{{NAVY}}" stroke-width="5"/>
  {{STORE_ICON}}
  {{BENEFITS}}

  <rect y="1270" width="1050" height="196" fill="{{NAVY}}"/>
  <rect y="1270" width="1050" height="5" fill="{{GOLD}}"/>
  <rect x="19" y="1280" width="174" height="174" rx="8" fill="#fff"/>
  <image href="{{QR}}" x="24" y="1285" width="164" height="164"/>
  <rect x="203" y="1295" width="4" height="145" fill="{{GOLD}}"/>
  {{CTA}}
  <circle cx="240" cy="1430" r="15" fill="none" stroke="{{GOLD}}" stroke-width="3"/>
  <path d="M235 1422l12 8-12 8z" fill="{{GOLD}}"/>
  <text class="sans white" x="266" y="1436" font-size="17" font-weight="700">SCAN THE CODE TO GET STARTED</text>
  <text class="sans white" x="965" y="1436" font-size="16" text-anchor="end">{{CTA_NOTE}}</text>

  <rect y="1466" width="1050" height="34" fill="#e3e8ed"/>
  <text class="sans navy" x="48" y="1489" font-size="12" font-weight="700" letter-spacing="1">LOCAL PEOPLE. LOCAL BUSINESSES. LOCAL IMPACT.</text>
  <text class="sans navy" x="1002" y="1489" font-size="12" text-anchor="end" font-weight="700">{{LOCALITY}}</text>
</svg>
